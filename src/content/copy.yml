projects:
  - name: Soul Tabletop
    years: 2026 – present
    status: In development
    stack: [Nuxt 4, Vue 3, TypeScript, PostgreSQL]
    summary: >-
      An open-source web-based virtual tabletop that is the successor to Lantern. An in-development
      version is available at soultabletop.com.
    details:
      - Users can write their own game character sheets in a custom markup language with support for formulas and dice rolls.
      - Includes an account system with per-resource permissions.
      - Built-in support for the Pathfinder game system.
      - Built with AI coding agents.
    links:
      - { label: soultabletop.com, href: "https://soultabletop.com" }
      - { label: Source, href: "https://github.com/lucyawrey/soultabletop" }

  - name: Project Comet
    years: 2024 – present
    status: Playable prototype
    stack: [.NET 10, C#, Unity, WebSockets]
    summary: >-
      An experimental framework for small-scale MMOs. Includes an authoritative .NET 10 game server that
      talks to clients over WebSockets, a Unity package for building clients, and ShapeLand, a playable
      prototype game built on top of it that runs on desktop PCs and in the browser.
    details:
      - Successfully load-tested ShapeLand with 300 simulated players on AWS.
      - Earlier prototypes were in Rust.
      - Built its most recent version with AI coding agents.
    links:
      - { label: Try ShapeLand, href: "https://shapeland.lucyawrey.com" }

  - name: Lantern
    years: 2019 – 2024
    status: Predecessor to Soul Tabletop
    stack: [Next.js, TypeScript, PostgreSQL, GraphQL]
    summary: >-
      I co-developed an early-stage virtual tabletop for the web. It is the predecessor to Soul
      Tabletop.
    details: []
    links: []

