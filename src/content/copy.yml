experience:
  - company: The Really Useful Information Company (TRUIC)
    title: Software Engineer → Interim Technical Team Lead
    dates: February 2019 – October 2023
    bullets:
      - Built on top of and maintained an internal CMS that powered three public websites (How To Start An LLC, Startup Savant, and truic.com). The CMS uses an ASP.NET backend, a Vue.js frontend, is backed by Cosmos DB, and is deployed on Azure App Service.
      - Shipped full-stack features from prototype to production. Built the database, data model, API endpoints, and frontend UI.
      - Built backend services for the public sites and worked on frontend code for their most interactive features, including our business logo generator and business name generator.
      - Led a partial move of older JavaScript components to React and TypeScript.
      - Ran Azure deployments, scaling, and performance tuning through CI/CD pipelines.
      - Wrote Python scripts for the site analytics pipeline and built reports in Google Analytics and Power BI. Used traffic and affiliate click-through metrics to decide which features to build and improve.
      - "Interim Technical Team Lead (2022 – 2023): after the CTO left, led our six-person development team. Ran code review, planned projects, worked on architecture for new features, and kept existing products running smoothly."
    sites:
      - { label: How To Start An LLC, href: "https://howtostartanllc.com" }
      - { label: Startup Savant, href: "https://startupsavant.com" }
      - { label: truic.com, href: "https://truic.com" }

